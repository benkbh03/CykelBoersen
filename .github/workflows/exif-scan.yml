# MIDLERTIDIG, kun læsning (del 1 af "Find hvorfor sælgere stopper ved billeder").
# Tæller EXIF/GPS i originalerne i bike-images. Fjernes igen i samme PR.
name: exif-scan
on:
  push:
    branches: [claude/project-thread-yhz2ck]
    paths: [scripts/exif-scan.py, .github/workflows/exif-scan.yml]
permissions:
  contents: read
jobs:
  scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Scan (første 128 KB af hver fil)
        run: python3 scripts/exif-scan.py https://ktufgncydxhkhfttojkh.supabase.co sb_publishable_bxJ_gRDrsJ-XCWWUD6NiQA_1nlPDA2B
      - name: Kryptér listen (loggen er offentlig)

name: Tjek indhold

# Fanger fejl i indholdet før merge: fx et blogindlæg dateret i fremtiden,
# en PR der bumper cache-versionen i hånden, eller en ny tabel uden GRANT.
on:
  pull_request:
  push:
    branches: [main]
    paths:
      - 'js/blog-data-v2.js'
      - 'scripts/check-blog-dates.mjs'
      - 'supabase/sql/**'
      - 'scripts/check-sql-grants.mjs'
      - '.github/workflows/check-content.yml'

permissions:
  contents: read

jobs:
  blog-dates:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Ingen blogdatoer efter i dag
        run: node scripts/check-blog-dates.mjs

  # Fra 30. okt. 2026 får nye tabeller i public ingen Data API-adgang af sig selv.
  # En ny tabel skal have RLS og GRANTs i samme fil (se CLAUDE.md).
  sql-grants:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Nye tabeller har GRANT og RLS
        run: node scripts/check-sql-grants.mjs

  # Cache-versionen sættes af sitemap.yml efter merge (scripts/stamp-asset-version.mjs).
  # En PR der selv ændrer den, giver merge-konflikt med hver anden åben PR.
  no-manual-cache-bump:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
      - name: index.html's cache-version er uændret
        run: |
          # Kun PR'ens egne ændringer (fra merge-basen), ikke det main har fået siden.
          # Fjernede linjer med versionen = en bump. Et nyt CSS-link tilføjer kun.
          bumped=$(git diff "origin/${{ github.base_ref }}...HEAD" -- index.html \
            | grep -E '^-[^-].*(data-asset-v=|\.css\?v=)' || true)
          if [ -n "$bumped" ]; then
            echo "::error file=index.html::Ret ikke cache-versionen i hånden. Den sættes automatisk efter merge. Fortryd ændringen af data-asset-v og CSS-linkenes ?v=."
            echo "$bumped"
            exit 1
          fi
          echo "Cache-versionen er ikke rørt."

  # Tre skriftvægte: --weight-regular (400), --weight-semibold (600) og
  # --weight-heavy (800). Archivo er en variabel font, så 500 og 700 tegnes
  # som egne vægte, og ca. 190 af dem gjorde siden uensartet (ryddet 30. okt.).
  font-weights:
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Kun de tre skriftvægte
        run: |
          bad=$(grep -rnE "font-weight:\s*(100|200|300|500|700|900|bold|bolder|lighter)\b" css js main.js index.html partials || true)
          if [ -n "$bad" ]; then
            echo "::error::Brug var(--weight-regular), var(--weight-semibold) eller var(--weight-heavy), ikke 500/700/bold."
            echo "$bad"
            exit 1
          fi

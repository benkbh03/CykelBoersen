name: Generate sitemap + prerender

# Kører dagligt + manuelt + ved push der ændrer kode, indhold eller scripts.
# 1) Sætter cache-versionen i index.html ud fra indholdet af css/, js/, main.js
#    og partials/ (scripts/stamp-asset-version.mjs). PR'er bumper den ikke selv.
# 2) Genererer en frisk sitemap.xml (aktive annoncer + verificerede forhandlere).
# 3) Prerenderer statiske SEO-sider (mærker + blog + oversigter) fra data-moduler.
# Committer kun hvis noget faktisk ændrede sig.
on:
  schedule:
    - cron: '0 3 * * *'   # dagligt 03:00 UTC (~05:00 dansk)
  workflow_dispatch:
  push:
    branches: [main]
    paths:
      - 'scripts/**'
      - '.github/workflows/sitemap.yml'
      # Cache-versionen hashes af disse, og prerendret indhold afhænger af
      # index.html og data-modulerne i js/.
      - 'index.html'
      - 'main.js'
      - 'js/**'
      - 'css/**'
      - 'partials/**'

# Én kørsel ad gangen: to merges lige efter hinanden må ikke skrive hver sin
# version oven i hinanden.
concurrency:
  group: sitemap-prerender
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          # Nyeste main, ikke den commit der startede kørslen: en kørsel der
          # stod i kø, skal hashe det der faktisk ligger på main nu.
          ref: main

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Sæt cache-version
        run: node scripts/stamp-asset-version.mjs

      - name: Generate sitemap.xml
        run: node scripts/generate-sitemap.mjs

      - name: Ingen blogdatoer efter i dag
        run: node scripts/check-blog-dates.mjs

      - name: Prerender statiske SEO-sider
        run: node scripts/prerender.mjs

      - name: Commit hvis ændret
        run: |
          # git add -A: robust — fanger sitemap.xml + ALLE prerendrede mapper
          # (cykler, blog, maerker, kategorier, bike). I CI adskiller working
          # tree sig kun ved genererede filer, så -A er sikkert og fremtidssikkert.
          if [ -n "$(git status --porcelain)" ]; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add -A
            git commit -m "chore: cache-version, sitemap og prerendrede sider"
            git push
          else
            echo "Sitemap + prerender uændret — ingen commit."
          fi
